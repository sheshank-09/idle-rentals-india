<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Idle Rentals India</title>
<style>
:root {
  --ink: #1E2A32; --teal: #1F6F6B; --sand: #F3EEE4; --clay: #C8643B; --line: #D8D0C0;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
* { box-sizing: border-box; }
body { margin: 0; font-family: system-ui, -apple-system, "Noto Sans", "Noto Sans Devanagari", "Noto Sans Tamil", "Noto Sans Telugu", "Noto Sans Bengali", sans-serif; font-size: 17px; line-height: 1.5; color: var(--ink); background: var(--sand); }
header { background: var(--ink); color: #fff; padding: 12px 16px; display: flex; justify-content: space-between; align-items: center; gap: 10px; }
header h1 { font-family: Georgia, serif; font-size: 20px; margin: 0; }
header select { font-size: 15px; padding: 6px; border-radius: 6px; border: 0; }
main { max-width: 640px; margin: 0 auto; padding: 16px 16px 96px; }
nav { position: fixed; bottom: 0; left: 0; right: 0; display: flex; background: var(--ink); padding-bottom: env(safe-area-inset-bottom, 0px); }
nav button { flex: 1; min-height: 60px; border: 0; background: transparent; color: #cfd8dc; font-size: 15px; }
nav button.on { background: var(--teal); color: #fff; font-weight: bold; }
h2 { font-family: Georgia, serif; font-size: 22px; margin: 4px 0 8px; }
.hint { color: #55626b; margin: 0 0 14px; }
.card { background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 14px; margin-bottom: 14px; }
label { display: block; font-weight: bold; margin: 10px 0 4px; }
input, select, textarea { width: 100%; font-size: 18px; padding: 12px; border: 2px solid #b9b09c; border-radius: 8px; background: #fff; color: var(--ink); }
button.go { width: 100%; min-height: 56px; margin-top: 14px; border: 0; border-radius: 10px; background: var(--teal); color: #fff; font-size: 18px; font-weight: bold; }
button.small { min-height: 44px; padding: 8px 12px; border: 2px solid var(--teal); background: #fff; color: var(--teal); border-radius: 8px; font-size: 15px; font-weight: bold; text-decoration: none; display: inline-block; }
button.danger { border-color: var(--clay); color: var(--clay); }
button:focus, input:focus, select:focus, textarea:focus, nav button:focus { outline: 3px solid var(--clay); outline-offset: 2px; }
.listing { background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 14px; margin-bottom: 12px; }
.listing h3 { margin: 0 0 4px; font-size: 19px; }
.meta { color: #55626b; font-size: 15px; }
.price { font-size: 20px; font-weight: bold; color: var(--teal); margin: 6px 0; }
.tag { display: inline-block; font-size: 14px; padding: 2px 10px; border-radius: 20px; background: var(--sand); margin-right: 6px; }
.tag.rented { background: #F6D9CB; color: var(--clay); }
.actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
.empty { text-align: center; color: #55626b; padding: 24px 8px; }
</style>
</head>
<body>
<header>
  <h1 id="app-title">Idle Rentals India</h1>
  <select id="lang" aria-label="Language" onchange="setLang(this.value)">
    <option value="en">English</option>
    <option value="hi">हिन्दी</option>
    <option value="ta">தமிழ்</option>
    <option value="te">తెలుగు</option>
    <option value="bn">বাংলা</option>
    <option value="mr">मराठी</option>
  </select>
</header>
<main>

<section id="s-browse">
  <h2 data-i="browseTitle"></h2>
  <p class="hint" data-i="browseHint"></p>
  <div class="card">
    <label for="search" data-i="search"></label>
    <input id="search" type="text" oninput="renderBrowse()">
    <label for="cat-filter" data-i="category"></label>
    <select id="cat-filter" onchange="renderBrowse()"></select>
    <label for="state-filter" data-i="state"></label>
    <select id="state-filter" onchange="renderBrowse()"></select>
  </div>
  <div id="browse-list"></div>
</section>

<section id="s-add" hidden>
  <h2 data-i="addTitle"></h2>
  <p class="hint" data-i="addHint"></p>
  <div class="card">
    <label for="i-name" data-i="itemName"></label>
    <input id="i-name" type="text">
    <label for="i-cat" data-i="category"></label>
    <select id="i-cat"></select>
    <label for="i-desc" data-i="details"></label>
    <textarea id="i-desc"></textarea>
    <label for="i-price" data-i="pricePerDay"></label>
    <input id="i-price" type="number" min="0" step="1" inputmode="numeric">
    <label for="i-deposit" data-i="deposit"></label>
    <input id="i-deposit" type="number" min="0" step="1" inputmode="numeric">
    <label for="i-state" data-i="state"></label>
    <select id="i-state" onchange="fillDistricts()"></select>
    <label for="i-district" data-i="district"></label>
    <select id="i-district" onchange="toggleManual()"></select>
    <div id="manual-box" hidden>
    <label for="i-manual" data-i="manualPlace"></label>
    <input id="i-manual" type="text">
    </div>
    <label for="i-contact" data-i="contact"></label>
    <input id="i-contact" type="tel" inputmode="tel">
    <button class="go" onclick="addItem()" data-i="listBtn"></button>
  </div>
</section>

<section id="s-mine" hidden>
  <h2 data-i="mineTitle"></h2>
  <p class="hint" data-i="mineHint"></p>
  <div id="mine-list"></div>
</section>

</main>
<nav>
  <button class="on" data-tab="s-browse" onclick="show('s-browse', this)" data-i="navBrowse"></button>
  <button data-tab="s-add" onclick="show('s-add', this)" data-i="navAdd"></button>
  <button data-tab="s-mine" onclick="show('s-mine', this)" data-i="navMine"></button>
</nav>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>

function fillDistricts() {
  const st = document.getElementById('i-state').value;
  document.getElementById('i-district').innerHTML = [...new Set(DISTRICTS[st] || [])].concat(['Other'])
    .map(d => `<option>${esc(d)}</option>`).join('');
  toggleManual();
}
function toggleManual() {
  const d = document.getElementById('i-district').value;
  document.getElementById('manual-box').hidden = d !== 'Other';
}
function placeOf() {
  const d = document.getElementById('i-district').value;
  return d === 'Other' ? (document.getElementById('i-manual').value.trim() || '-') : d;
}

const t = k => (T[lang] && T[lang][k]) || T.en[k];
const catLabel = c => (CATS[c] && (CATS[c][lang] || CATS[c].en)) || c;
const rupees = n => '₹' + Number(n).toLocaleString('en-IN');
function esc(s) { return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function setLang(code) {
  lang = code;
  document.documentElement.lang = code;
  document.querySelectorAll('[data-i]').forEach(el => {
    const k = el.getAttribute('data-i');
    if (el.tagName === 'INPUT') el.placeholder = t(k); else el.textContent = t(k);
  });
  document.getElementById('app-title').textContent = t('appTitle');
  document.title = t('appTitle');
  fillSelects();
  renderBrowse();
  renderMine();
}
function fillSelects() {
  const catOpts = Object.keys(CATS).map(c => `<option value="${c}">${esc(catLabel(c))}</option>`).join('');
  const stateOpts = STATES.map(s => `<option>${esc(s)}</option>`).join('');
  const sel = document.getElementById('cat-filter').value;
  const ss = document.getElementById('state-filter').value;
  document.getElementById('cat-filter').innerHTML = `<option value="">${t('allCats')}</option>` + catOpts;
  document.getElementById('state-filter').innerHTML = `<option value="">${t('allStates')}</option>` + stateOpts;
  document.getElementById('cat-filter').value = sel;
  document.getElementById('state-filter').value = ss;
  document.getElementById('i-cat').innerHTML = catOpts;
  document.getElementById('i-state').innerHTML = stateOpts;
  fillDistricts();
}
function show(id, btn) {
  document.querySelectorAll('main section').forEach(s => s.hidden = s.id !== id);
  document.querySelectorAll('nav button').forEach(b => b.classList.toggle('on', b === btn));
  if (id === 's-mine') renderMine();
  window.scrollTo(0, 0);
}
function card(it, controls) {
  const tag = it.status === 'rented' ? 'tag rented' : 'tag';
  const label = it.status === 'rented' ? t('rented') : t('available');
  return `<div class="listing">
    <h3>${esc(it.name)}</h3>
    <div class="meta">${esc(catLabel(it.cat))} · ${esc(it.district)}, ${esc(it.state)}</div>
    <div class="price">${rupees(it.price)} ${t('perDay')}${it.deposit ? ` · ${t('depositLbl')} ${rupees(it.deposit)}` : ''}</div>
    <p style="margin:4px 0">${esc(it.desc)}</p>
    <span class="${tag}">${label}</span>
    ${controls}
  </div>`;
}
function renderBrowse() {
  const q = document.getElementById('search').value.trim().toLowerCase();
  const cat = document.getElementById('cat-filter').value;
  const st = document.getElementById('state-filter').value;
  const list = items.filter(it =>
    (!cat || it.cat === cat) && (!st || it.state === st) &&
    (!q || it.name.toLowerCase().includes(q) || it.desc.toLowerCase().includes(q) || it.district.toLowerCase().includes(q))
  );
  document.getElementById('browse-list').innerHTML = list.length
    ? list.map(it => card(it, `<div class="actions"><a class="small" href="tel:${esc(it.contact)}">${t('contactOwner')}</a></div>`)).join('')
    : `<div class="empty">${loading ? 'Loading listings...' : t('none')}</div>`;
}
async function addItem() {
  const v = id => document.getElementById(id).value.trim();
  const name = v('i-name'), price = parseInt(v('i-price'), 10), contact = v('i-contact');
  if (!name || isNaN(price) || !contact) { alert(t('needFields')); return; }
  if (!fdb || !myId) { alert('Connecting. Please check your internet and try again.'); return; }
  const id = 'l' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  try {
    await fdb.collection('listings').doc(id).set({
      name, cat: v('i-cat'), desc: v('i-desc') || '-', price,
      deposit: parseInt(v('i-deposit'), 10) || 0,
      state: v('i-state'), district: placeOf(), contact,
      status: 'available', ownerId: myId, createdAt: Date.now()
    });
  } catch (e) { alert('Could not save the listing. Check your internet and try again.'); return; }
  ['i-name','i-desc','i-price','i-deposit','i-contact','i-manual'].forEach(x => document.getElementById(x).value = '');
  alert(t('listed'));
}
async function toggleStatus(id) {
  const it = items.find(x => x.id === id);
  if (!it || !fdb) return;
  try {
    await fdb.collection('listings').doc(id).update({ status: it.status === 'rented' ? 'available' : 'rented' });
  } catch (e) { alert('Could not update. Check your internet and try again.'); }
}
async function removeItem(id) {
  if (!confirm(t('confirmRemove')) || !fdb) return;
  try { await fdb.collection('listings').doc(id).delete(); }
  catch (e) { alert('Could not remove. Check your internet and try again.'); }
}
function renderMine() {
  const mine = items.filter(it => it.ownerId && it.ownerId === myId);
  document.getElementById('mine-list').innerHTML = mine.length
    ? mine.map(it => card(it, `<div class="actions">
        <button class="small" onclick="toggleStatus('${esc(it.id)}')">${it.status === 'rented' ? t('markAvailable') : t('markRented')}</button>
        <button class="small danger" onclick="removeItem('${esc(it.id)}')">${t('remove')}</button></div>`)).join('')
    : `<div class="empty">${t('noMine')}</div>`;
}

function startSync() {
  fdb.collection('listings').onSnapshot(snap => {
    loading = false;
    items = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    items.sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
    renderBrowse();
    renderMine();
  }, err => {
    loading = false;
    console.error('Listings sync stopped:', err);
    renderBrowse();
  });
}

setLang('en');
(function startFirebase() {
  if (firebaseConfig.apiKey.startsWith('PASTE')) {
    loading = false; renderBrowse(); renderMine();
    console.error('Firebase config not set yet.');
    return;
  }
  try {
    firebase.initializeApp(firebaseConfig);
    fdb = firebase.firestore();
    firebase.auth().signInAnonymously().then(c => {
      myId = c.user.uid;
      startSync();
      renderMine();
    }).catch(e => {
      loading = false; renderBrowse(); console.error('Sign-in failed:', e);
    });
  } catch (e) {
    loading = false; renderBrowse(); console.error(e);
  }
})();
